<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>37x37 3D House Plan</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #info {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.7); color: #fff;
            padding: 12px 18px; border-radius: 8px;
            pointer-events: none; user-select: none;
            font-size: 14px; z-index: 10;
        }
        #info span { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border-radius: 2px; }
        .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; }
    </style>
</head>
<body>
    <div id="info">
        <strong>🏠 37ft x 37ft 3D Layout</strong>
        <div class="legend" id="legend"></div>
        <div style="margin-top:6px; font-size:12px; opacity:0.7;">🖱️ Drag to rotate · Scroll to zoom</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
       <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // -------- Scene setup --------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(45, 35, 55);
        camera.lookAt(18, 5, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none'; // allow click-through to orbit
        document.body.appendChild(labelRenderer.domElement);
           const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(18, 5, 18);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 15;
        controls.maxDistance = 100;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.update();

        // -------- Lighting --------
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        sunLight.position.set(30, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.left = -50;
        sunLight.shadow.camera.right = 50;
        sunLight.shadow.camera.top = 50;
        sunLight.shadow.camera.bottom = -50;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.4);
        fillLight.position.set(-20, 10, -30);
        scene.add(fillLight);

        // -------- Ground plane --------
        const groundGeo = new THREE.PlaneGeometry(42, 42);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x2a2a3a,
            roughness: 0.9,
            metalness: 0.1,
            side: THREE.DoubleSide,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.set(18, -0.05, 18);
        ground.receiveShadow = true;
        scene.add(ground);
               // Grid helper (feet)
        const grid = new THREE.GridHelper(42, 21, 0x88aaff, 0x445577);
        grid.position.set(18, 0, 18);
        scene.add(grid);

        // -------- Room data: x, z, width, depth, color, name --------
        const rooms = [
            { x: 0, z: 0, w: 12, d: 15, color: 0xffaa66, name: 'Room 1 (12×15)' },
            { x: 12, z: 0, w: 8, d: 15, color: 0x66aaff, name: 'Front Hall' },
            { x: 20, z: 0, w: 12, d: 17, color: 0x66ffaa, name: 'Drawing Room (12×17)' },
            { x: 32, z: 0, w: 5, d: 8, color: 0xff66aa, name: 'Bath 1 (5×8)' },
            { x: 12, z: 15, w: 8, d: 22, color: 0x88ccff, name: 'Corridor' },
            { x: 0, z: 22, w: 12, d: 15, color: 0xaa66ff, name: 'Room 2 (12×15)' },
            { x: 20, z: 25, w: 8, d: 12, color: 0x66ffcc, name: 'Kitchen (8×12)' },
            { x: 28, z: 20, w: 5, d: 8, color: 0xff66cc, name: 'Bath 2 (5×8)' },
        ];

        const wallColor = 0xddddff;
        const wallMat = new THREE.MeshStandardMaterial({
            color: wallColor,
            roughness: 0.5,
            metalness: 0.1,
            transparent: true,
            opacity: 0.85,
        });
        const wallMatOpaque = new THREE.MeshStandardMaterial({
            color: wallColor,
            roughness: 0.5,
            metalness: 0.1,
        });

        const floorHeight = 0.2;
        const wallHeight = 10;
        const wallThick = 0.3;

        // Helper: add a wall as a box
        function addWall(px, py, pz, w, h, d, mat = wallMat) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(px, py, pz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // Helper: add a floor slab
        function addFloor(px, pz, w, d, color) {
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.7,
                metalness: 0.1,
            });
            const geo = new THREE.BoxGeometry(w, floorHeight, d);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(px, floorHeight / 2, pz);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);
            return mesh;
        }

        // Helper: add a label (CSS2D)
        function addLabel(text, px, py, pz, color = '#ffffff') {const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontSize = '14px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 3px rgba(0,0,0,0.8)';
            div.style.background = 'rgba(0,0,0,0.6)';
            div.style.padding = '4px 10px';
            div.style.borderRadius = '4px';
            div.style.border = '1px solid rgba(255,255,255,0.2)';
            div.style.pointerEvents = 'none';
            const label = new CSS2DObject(div);
            label.position.set(px, py, pz);
            scene.add(label);
            return label;
        }

        // -------- Build rooms --------
        rooms.forEach(room => {
            const cx = room.x + room.w / 2;
            const cz = room.z + room.d / 2;

            // Floor
            addFloor(cx, cz, room.w, room.d, room.color);

            // Walls (only if not sharing with another room – but we draw all, they overlap nicely)
            // Front (z = room.z)
            addWall(cx, wallHeight / 2, room.z, room.w, wallHeight, wallThick);
            // Back (z = room.z + room.d)
            addWall(cx, wallHeight / 2, room.z + room.d, room.w, wallHeight, wallThick);
            // Left (x = room.x)
            addWall(room.x, wallHeight / 2, cz, wallThick, wallHeight, room.d);
            // Right (x = room.x + room.w)
            addWall(room.x + room.w, wallHeight / 2, cz, wallThick, wallHeight, room.d);

            // Label (placed at ceiling height)
            addLabel(room.name, cx, wallHeight + 1.5, cz, '#fff');
        });

        // -------- Add main gate indicator --------
        const gateMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200 });
        const gateGeo = new THREE.BoxGeometry(6, 8, 0.5);
        const gate = new THREE.Mesh(gateGeo, gateMat);
        gate.position.set(18, 4, -0.25);
        gate.castShadow = true;
        scene.add(gate);
        addLabel('🚪 MAIN GATE', 18, 9, -1.5, '#ffaa44');
              // -------- Add outline of the plot --------
        const plotPoints = [
            [0, 0], [37, 0], [37, 37], [0, 37], [0, 0]
        ];
        const plotGeo = new THREE.BufferGeometry();
        const vertices = [];
        plotPoints.forEach(p => {
            vertices.push(p[0], 0.1, p[1]);
        });
        plotGeo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        const plotLine = new THREE.Line(
            plotGeo,
            new THREE.LineBasicMaterial({ color: 0xffaa66, linewidth: 2 })
        );
        scene.add(plotLine);

        // Also a glowing transparent box around the plot
        const plotBoxMat = new THREE.MeshBasicMaterial({
            color: 0xffaa66,
            wireframe: true,
            transparent: true,
            opacity: 0.15,
        });
        const plotBox = new THREE.Mesh(new THREE.BoxGeometry(37, 10, 37), plotBoxMat);
        plotBox.position.set(18.5, 5, 18.5);
        scene.add(plotBox);

        // -------- Legend generation --------
        const legendDiv = document.getElementById('legend');
        rooms.forEach(room => {
            const item = document.createElement('div');
            item.className = 'legend-item';
            const colorHex = '#' + room.color.toString(16).padStart(6, '0');
            item.innerHTML = `<span style="background:${colorHex};"></span> ${room.name}`;
            legendDiv.appendChild(item);
        });

        // -------- Resize handler --------
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        });

        // -------- Animation loop --------
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        console.log('🏠 3D House loaded!');
    </script>
</body>
</html>
